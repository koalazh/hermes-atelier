name: atelier-drafter
version: 2.0.0
description: "Explicit write-scoped Draft mode for the Hermes Atelier Builder"
hermes_requires: ">=0.19.0"
author: "Hermes Atelier"
license: "MIT"
env_requires:
  - name: OPENAI_API_KEY
    description: "Credential for the configured OpenAI-compatible model endpoint"
    required: true
  - name: ATELIER_MODEL
    description: "Model exposed by the configured endpoint"
    required: true
  - name: ATELIER_MODEL_BASE_URL
    description: "OpenAI-compatible endpoint including its API prefix"
    required: true
  - name: ATELIER_DRAFT_ROOT
    description: "Exact parent directory for explicit Draft generation"
    required: true
distribution_owned:
  - SOUL.md
  - config.yaml
  - skills/
  - distribution.yaml
