schema_version: 2
id: project-defense
version: 2.0.0
description: Evidence-grounded project defense practice over a constrained sample workspace.
entry: host
agents:
  host:
    distribution: profiles/host
    exposure: public
    description: Leads the conversation and decides which evidence or coaching is useful.
  source:
    distribution: profiles/source
    exposure: internal
    description: Reads only the Profile-owned sample source workspace.
  architecture:
    distribution: profiles/architecture
    exposure: internal
    description: Explains architectural tradeoffs without inventing source evidence.
  coach:
    distribution: profiles/coach
    exposure: internal
    description: Coaches delivery using an independent retained Memory scope when requested.
allowed_calls:
  host: [source, architecture, coach]
collaboration: [profile_call]
public_api:
  protocol: openai
  endpoints: [/v1/responses, /v1/chat/completions]
state_policy: caller_scoped
state_compatibility: review_required
cases:
  - cases/evidence-gap.yaml
  - cases/architecture.yaml
  - cases/coach-only.yaml
contracts: []
