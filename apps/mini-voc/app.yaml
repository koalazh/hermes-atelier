schema_version: 2
id: mini-voc
version: 2.0.0
description: A simulated voice-of-customer triage App Pack with independently tooled experts.
entry: dispatcher
agents:
  dispatcher:
    distribution: profiles/dispatcher
    exposure: public
    description: Clarifies feedback and decides whether specialist evidence is needed.
  product:
    distribution: profiles/product
    exposure: internal
    description: Looks up simulated product ownership and release evidence.
  transaction:
    distribution: profiles/transaction
    exposure: internal
    description: Looks up simulated order and refund evidence.
allowed_calls:
  dispatcher: [product, transaction]
collaboration: [profile_call]
public_api:
  protocol: openai
  endpoints: [/v1/responses, /v1/chat/completions]
state_policy: session_only
state_compatibility: preserve
cases:
  - cases/clarify.yaml
  - cases/product.yaml
  - cases/cross-domain.yaml
  - cases/expert-failure.yaml
contracts: []
