[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hermes-atelier"
version = "2.1.0"
description = "Design and deliver Hermes App Packs with optional assurance evidence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
atelier = "plugin.atelier.cli_v2:main"

[tool.hatch.build.targets.wheel]
packages = ["plugin"]

[tool.hatch.build.targets.sdist]
include = [
  "/AGENTS.md",
  "/README.md",
  "/apps",
  "/docs",
  "/plugin",
  "/profiles",
  "/pyproject.toml",
  "/tests",
  "/uv.lock",
]

[tool.hatch.build.targets.sdist.force-include]
"plugin/atelier" = "plugin/atelier"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
